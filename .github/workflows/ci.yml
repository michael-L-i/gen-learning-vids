name: Check
# Runs for pull requests into main and for pushes to main. Pushes to other
# branches do not trigger a run; start one manually from Actions if needed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          LEARNVID_BROWSER_TEST: "1"
      - run: npm run test:ui
